name: Reglas del hoyo
on:
  push:
    paths:
      - 'Assets/Scripts/Partida/PartidaHoyo.cs'
      - 'Pruebas/**'
      - '.github/workflows/probar-hoyo.yml'
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project Pruebas/Pruebas.csproj
