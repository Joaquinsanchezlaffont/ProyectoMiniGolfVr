name: Exportar nivel Blender con bpy
on:
  push:
    paths:
      - '.github/workflows/exportar-blender-bpy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exportar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar bpy
        run: |
          python -m pip install --only-binary=:all: bpy
      - name: Exportar pista, pelota y palo
        run: |
          cat > /tmp/exportar_minigolf.py <<'PY'
          import bpy
          bpy.context.preferences.filepaths.use_scripts_auto_execute = False
          bpy.ops.wm.open_mainfile(filepath='Assets/Models/protecto29sep.blend', load_ui=False)
          import json
          import re
          import unicodedata
          from pathlib import Path

          scale = 0.30
          base = Path("Assets/Models/Blender")
          base.mkdir(parents=True, exist_ok=True)
          grip = bpy.data.objects["Empuñadura del palo"].matrix_world.translation
          head = bpy.data.objects["Cabeza del palo"].matrix_world.translation
          shaft = (head.xy - grip.xy).normalized()
          side = (-shaft.y, shaft.x)
          ball_center = bpy.data.objects["Pelota de golf"].matrix_world.translation

          def unity_point(v, group):
              if group == "ball":
                  v = v - ball_center
              elif group == "club":
                  v = v - grip
                  return (scale * (v.x * side[0] + v.y * side[1]),
                          -scale * (v.x * shaft.x + v.y * shaft.y),
                          scale * v.z)
              return (scale * v.x, scale * v.z, scale * v.y)

          def slug(name):
              plain = unicodedata.normalize("NFKD", name).encode("ascii", "ignore").decode("ascii")
              return re.sub(r"[^a-zA-Z0-9]+", "_", plain).strip("_")

          club_names = {"Cabeza del palo", "Cuello del palo", "Empuñadura del palo",
              "Varilla del palo", "Aro de la empuñadura 00", "Aro de la empuñadura 01",
              "Ranura de la cara 00", "Ranura de la cara 01", "Ranura de la cara 02"}
          mats = {}
          object_info = []
          depsgraph = bpy.context.evaluated_depsgraph_get()

          def material_id(mat):
              name = mat.name if mat else "Sin material"
              if name not in mats:
                  code = "M%03d_%s" % (len(mats), slug(name))
                  color = tuple(mat.diffuse_color) if mat else (0.7, 0.7, 0.7, 1.0)
                  if mat and mat.use_nodes:
                      node = next((n for n in mat.node_tree.nodes if n.type == "BSDF_PRINCIPLED"), None)
                      if node:
                          color = tuple(node.inputs["Base Color"].default_value)
                  mats[name] = {"id": code, "name": name,
                      "color": [round(float(c), 5) for c in color]}
              return mats[name]["id"]

          def write_group(group, filename):
              count = 0
              with (base / filename).open("w", encoding="utf-8", newline="\n") as f:
                  f.write("# protecto29sep.blend - geometria y escala preparadas para Unity\nmtllib Paleta.mtl\n")
                  offset = 1
                  for obj in bpy.data.objects:
                      if obj.type not in {"MESH", "CURVE"}:
                          continue
                      target = "ball" if obj.name == "Pelota de golf" else (
                          "club" if obj.name in club_names else "course")
                      if target != group:
                          continue
                      evaluated = obj.evaluated_get(depsgraph)
                      mesh = evaluated.to_mesh()
                      try:
                          if not mesh or not mesh.vertices or not mesh.polygons:
                              continue
                          mesh_name = slug(obj.name)
                          f.write("o " + mesh_name + "\n")
                          for vert in mesh.vertices:
                              x, y, z = unity_point(evaluated.matrix_world @ vert.co, group)
                              f.write("v %.6f %.6f %.6f\n" % (x, y, z))
                          current = None
                          for poly in mesh.polygons:
                              mat = obj.material_slots[poly.material_index].material if poly.material_index < len(obj.material_slots) else None
                              mid = material_id(mat)
                              if mid != current:
                                  f.write("usemtl " + mid + "\n")
                                  current = mid
                              indices = [int(i) + offset for i in poly.vertices]
                              if group != "club":
                                  indices.reverse()
                              f.write("f " + " ".join(str(i) for i in indices) + "\n")
                          object_info.append({"name": mesh_name, "source": obj.name,
                              "material": current, "group": group})
                          offset += len(mesh.vertices)
                          count += 1
                      finally:
                          evaluated.to_mesh_clear()
              print("MINIGOLF_EXPORT", filename, "objects", count,
                  "bytes", (base / filename).stat().st_size)
              if count == 0:
                  raise RuntimeError("No se exportaron objetos: " + group)

          write_group("course", "PrimerNivel.obj")
          write_group("ball", "PelotaBlender.obj")
          write_group("club", "PaloBlender.obj")
          with (base / "Paleta.mtl").open("w", encoding="utf-8", newline="\n") as f:
              for m in mats.values():
                  c = m["color"]
                  f.write("newmtl %s\nKd %f %f %f\nd %f\n\n" %
                      (m["id"], c[0], c[1], c[2], c[3]))
          tee = bpy.data.objects["Plataforma de salida"].matrix_world.translation
          cup = bpy.data.objects["Hoyo"].matrix_world.translation
          grip_head = unity_point(head, "club")
          data = {"scale": scale,
              "tee": [round(scale * tee.x, 5), 0.112, round(scale * tee.y, 5)],
              "cup": [round(scale * cup.x, 5), round(scale * cup.z, 5), round(scale * cup.y, 5)],
              "ballRadius": 0.093,
              "clubHead": [round(float(v), 5) for v in grip_head],
              "materials": list(mats.values()), "objects": object_info}
          (base / "NivelBlender.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("MINIGOLF_DATA=", json.dumps(
              {k: data[k] for k in ("scale", "tee", "cup", "ballRadius", "clubHead")}))
          PY
          python /tmp/exportar_minigolf.py
      - name: Guardar modelos exportados
        run: |
          git config user.name aurelkio
          git config user.email aurelkio@users.noreply.github.com
          git add Assets/Models/Blender
          git commit -m "aurelkio"
          git push
