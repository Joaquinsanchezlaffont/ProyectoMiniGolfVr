name: Inspeccionar modelo Blender
on:
  push:
    paths:
      - 'Assets/Models/protecto29sep.blend'
      - '.github/workflows/inspeccionar-blender.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
          blender --version
      - name: Listar objetos y dimensiones del nivel
        run: |
          cat > /tmp/inventario_minigolf.py <<'PY'
          import bpy, json
          from mathutils import Vector
          scene = bpy.context.scene
          inventory = []
          for ob in bpy.data.objects:
              item = {"name": ob.name, "type": ob.type, "parent": ob.parent.name if ob.parent else None,
                      "collection": [c.name for c in ob.users_collection],
                      "location": [round(v, 3) for v in ob.matrix_world.translation],
                      "rotation": [round(v, 3) for v in ob.rotation_euler],
                      "dimensions": [round(v, 3) for v in ob.dimensions],
                      "hidden": bool(ob.hide_render or ob.hide_viewport)}
              if ob.type == "MESH":
                  item["vertices"] = len(ob.data.vertices)
                  item["faces"] = len(ob.data.polygons)
                  item["materials"] = [m.name if m else None for m in ob.data.materials]
                  corners = [ob.matrix_world @ Vector(p) for p in ob.bound_box]
                  item["world_min"] = [round(min(v[i] for v in corners), 3) for i in range(3)]
                  item["world_max"] = [round(max(v[i] for v in corners), 3) for i in range(3)]
              inventory.append(item)
          print("MINIGOLF_INVENTORY=" + json.dumps({"blender": bpy.app.version_string,
              "scene": scene.name, "units": scene.unit_settings.system,
              "scale_length": scene.unit_settings.scale_length, "objects": inventory}, ensure_ascii=False))
          PY
          blender --background --disable-autoexec Assets/Models/protecto29sep.blend --python /tmp/inventario_minigolf.py
